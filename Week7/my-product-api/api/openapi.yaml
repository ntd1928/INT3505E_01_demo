openapi: 3.0.3
info:
  title: Product API
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Products
  description: Operations about products
paths:
  /products:
    get:
      tags:
      - Products
      summary: Get all products
      operationId: getAllProducts
      responses:
        "200":
          description: A list of products.
      x-swagger-router-controller: Products
    post:
      tags:
      - Products
      summary: Create a new product
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
        required: true
      responses:
        "201":
          description: Product created successfully.
      x-swagger-router-controller: Products
  /products/{productId}:
    get:
      tags:
      - Products
      summary: Get a product by ID
      operationId: getProductById
      parameters:
      - name: productId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Successful operation.
      x-swagger-router-controller: Products
    put:
      tags:
      - Products
      summary: Update a product
      operationId: updateProduct
      parameters:
      - name: productId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
        required: true
      responses:
        "200":
          description: Product updated successfully.
      x-swagger-router-controller: Products
    delete:
      tags:
      - Products
      summary: Delete a product
      operationId: deleteProduct
      parameters:
      - name: productId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "204":
          description: Product deleted successfully.
      x-swagger-router-controller: Products
components:
  schemas:
    Product:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        name:
          type: string
        price:
          type: number
          format: float
        description:
          type: string
    NewProduct:
      required:
      - name
      - price
      type: object
      properties:
        name:
          type: string
          example: Laptop Pro
        price:
          type: number
          format: float
          example: 1200.5
        description:
          type: string
          example: A powerful new laptop
