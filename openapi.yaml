# Phiên bản OpenAPI
openapi: 3.0.3

# Thông tin chung về API
info:
  title: Library Management API
  description: API để quản lý người dùng, sách, và các hoạt động mượn/trả sách trong thư viện.
  version: "1.0"

# Địa chỉ server
servers:
  - url: http://127.0.0.1:5001/api/v1
    description: Development Server

# Gắn thẻ để nhóm các endpoints trong UI
tags:
  - name: Authentication
    description: Các API để đăng nhập và lấy token
  - name: User Operations
    description: Các API để quản lý người dùng
  - name: Book Operations
    description: Các API để quản lý sách (CRUD)
  - name: Borrow Operations
    description: Các API quản lý tài nguyên Lượt Mượn (Borrow)

# Định nghĩa tất cả các endpoints (đường dẫn)
paths:
  # --- Authentication Path ---
  /auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập để lấy JWT Token 🔑
      description: Cung cấp email và password để nhận về một JWT token có hiệu lực trong 60 phút.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Đăng nhập thành công, trả về token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Unauthorized (Email hoặc password không chính xác).

  # --- User Paths ---
  /users:
    get:
      tags: [User Operations]
      summary: Lấy danh sách tất cả người dùng 🧑‍🤝‍🧑
      responses:
        '200':
          description: Thành công. Trả về một mảng các đối tượng người dùng.
    post:
      tags: [User Operations]
      summary: Tạo một người dùng mới (Đăng ký) 👤
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Tạo người dùng thành công.
        '400':
          description: Thiếu các trường bắt buộc.
        '409':
          description: Email đã tồn tại.

  /users/{user_id}:
    get:
      tags: [User Operations]
      summary: Tìm người dùng theo ID 🆔
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Thông tin chi tiết của người dùng.
        '404':
          description: Không tìm thấy người dùng.
          
  /users/{user_id}/borrows:
    get:
      tags: [User Operations]
      summary: Lấy sách đang được mượn bởi một người dùng 🙋‍♂️📚
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Thành công. Trả về danh sách các sách đang được mượn.
        '404':
          description: Không tìm thấy người dùng.
          
  /user/borrows:
    get:
      tags: [Borrow Operations]
      summary: Lấy lịch sử mượn sách của người dùng đã xác thực 🙋‍♀️🧾
      description: Lấy lịch sử mượn sách của chính người dùng dựa trên token được cung cấp. **Yêu cầu xác thực.**
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thành công. Trả về danh sách các lượt mượn.
        '401':
          description: Unauthorized (Token không hợp lệ hoặc bị thiếu).

  # --- Book Paths ---
  /books:
    get:
      tags: [Book Operations]
      summary: Lấy danh sách sách (hỗ trợ lọc & phân trang) 📚
      parameters:
        - name: search
          in: query
          description: Tìm kiếm sách theo tiêu đề.
          schema: { type: string }
        - name: author
          in: query
          description: Lọc sách theo tác giả.
          schema: { type: string }
        - name: year
          in: query
          description: Lọc sách theo năm xuất bản.
          schema: { type: integer }
      responses:
        '200':
          description: Thành công. Trả về danh sách sách và thông tin phân trang.
    post:
      tags: [Book Operations]
      summary: Thêm một sách mới 📖
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBook'
      responses:
        '201':
          description: Tạo sách thành công.
        '400':
          description: Thiếu các trường bắt buộc.
  /books-cursor:
    get:
      tags: [Book Operations]
      summary: Lấy danh sách sách (phân trang bằng con trỏ) 🛰️
      description: Lấy danh sách sách sử dụng cursor-based pagination để có hiệu suất tốt với dữ liệu động.
      parameters:
        - name: limit
          in: query
          description: Số lượng sách tối đa trên mỗi trang.
          schema: { type: integer, default: 10 }
        - name: after
          in: query
          description: "Con trỏ - ID của cuốn sách cuối cùng đã thấy."
          schema: { type: integer }
      responses:
        '200':
          description: Thành công. Trả về danh sách sách và con trỏ cho trang tiếp theo.

  /books/{book_id}:
    get:
      tags: [Book Operations]
      summary: Tìm sách theo ID 🔍
      parameters:
        - $ref: '#/components/parameters/BookIdParam'
      responses:
        '200':
          description: Thông tin chi tiết của sách.
        '404':
          description: Không tìm thấy sách.
    put:
      tags: [Book Operations]
      summary: Cập nhật thông tin sách 🔄
      parameters:
        - $ref: '#/components/parameters/BookIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBook'
      responses:
        '200':
          description: Cập nhật thành công.
        '400':
          description: Thiếu các trường bắt buộc.
        '404':
          description: Không tìm thấy sách.
    delete:
      tags: [Book Operations]
      summary: Xóa một cuốn sách ❌
      parameters:
        - $ref: '#/components/parameters/BookIdParam'
      responses:
        '204':
          description: Xóa sách thành công.
        '404':
          description: Không tìm thấy sách.
        '409':
          description: Không thể xóa sách đang được mượn.

  # --- Borrow Paths ---
  /borrows:
    post:
      tags: [Borrow Operations]
      summary: Mượn sách (Tạo một lượt mượn mới) 🛒
      description: Tạo một bản ghi mới trong tài nguyên 'borrows'. **Yêu cầu xác thực.**
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBorrow'
      responses:
        '201':
          description: Mượn sách thành công.
        '401':
          description: Unauthorized.
        '404':
          description: Không tìm thấy sách.
        '409':
          description: Sách không có sẵn để mượn.

  /borrows/{borrow_id}:
    delete:
      tags: [Borrow Operations]
      summary: Trả sách (Xóa một lượt mượn) 📬
      description: Kết thúc một lượt mượn bằng cách xóa bản ghi tương ứng. **Yêu cầu xác thực.**
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BorrowIdParam'
      responses:
        '204':
          description: Trả sách thành công.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Không tìm thấy bản ghi mượn sách.

# Nơi định nghĩa các thành phần có thể tái sử dụng
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập token JWT của bạn vào đây theo định dạng `Bearer <token>`.

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, readOnly: true, example: 1 }
        name: { type: string, example: "Alice" }
        email: { type: string, format: email, example: "alice@example.com" }
        member_since: { type: string, format: date, example: "2023-01-15" }
    NewUser:
      type: object
      properties:
        name: { type: string, example: "Bob" }
        email: { type: string, format: email, example: "bob@example.com" }
        password: { type: string, format: password, example: "supersecret" }
      required: [name, email, password]

    LoginCredentials:
      type: object
      properties:
        email: { type: string, format: email, example: "alice@example.com" }
        password: { type: string, format: password, example: "supersecret" }
      required: [email, password]

    Book:
      type: object
      properties:
        id: { type: integer, readOnly: true, example: 101 }
        title: { type: string, example: "Lão Hạc" }
        author: { type: string, example: "Nam Cao" }
        year: { type: integer, example: 1943 }
        status: { type: string, enum: [available, borrowed], example: "available" }
    NewBook:
      type: object
      properties:
        title: { type: string, example: "Số Đỏ" }
        author: { type: string, example: "Vũ Trọng Phụng" }
        year: { type: integer, example: 1936 }
      required: [title, author, year]

    BorrowRecord:
      type: object
      properties:
        borrow_id: { type: integer, readOnly: true }
        book_id: { type: integer }
        user_id: { type: integer }
        borrow_date: { type: string, format: date }
        return_date: { type: string, format: date, nullable: true }
    NewBorrow:
      type: object
      properties:
        book_id: { type: integer, description: ID của sách cần mượn, example: 2 }
      required: [book_id]

  parameters:
    BookIdParam:
      name: book_id
      in: path
      description: ID của cuốn sách.
      required: true
      schema: { type: integer }
    UserIdParam:
      name: user_id
      in: path
      description: ID của người dùng.
      required: true
      schema: { type: integer }
    BorrowIdParam:
      name: borrow_id
      in: path
      description: ID của lượt mượn.
      required: true
      schema: { type: integer }